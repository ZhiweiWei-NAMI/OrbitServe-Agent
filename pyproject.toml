[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitserve-agent"
version = "0.1.0"
description = "Prediction-interface-driven distributed remote sensing rule prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "rasterio>=1.4", "scipy>=1.14", "pillow>=11", "requests>=2.32", "matplotlib>=3.9", "shapely>=2.0", "pyproj>=3.6"]

[project.scripts]
orbitserve = "orbitserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
